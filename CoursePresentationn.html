<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title >Document</title>
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/CoursePresentationn.css">
</head>

<body>

    <header>
        <nav class="navbar fixed-top border-bottom navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="nav-link f-20 bold" href="#"><i class="f-27 fa-solid fa-book" style="color: #4F39F6;"></i><span data-i18n="header.head"></span></a>

                <div class="menu">
                    <button><i class="fas fa-bars"></i></button>
                </div>

                <div class="sidemenu">
                    <button class="close"><i class="fas fa-times"></i></button>
                    <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                        <li class="bold nav-item"><a data-i18n="header.li1" class="nav-link" href="index.html"></a></li>
                        <li class="bold nav-item"><a data-i18n="header.li2" class="nav-link" href="course.html"></a></li>
                        <li class="bold nav-item"><a data-i18n="header.li3" class="nav-link" href="about.html"></a></li>
                        <li class="lang bold nav-item ">English</li>
                    </ul>
                </div>

            </div>
        </nav>
    </header>
    
    <main>
        <div class="container">
            <section class="hero sec1">
                <p class="bold"><a data-i18n="CoursePresentationn.back" href="course.html"></a></p>
            </section>

            <section class="hero js sec2 mb-5">
                
            </section>

            <section class="hero sec3 mb-5">
                <div class="container-fluid">
                    <div class="row lect align-items-center gx-0">
                        <div class="col progress-title">
                            <h5 data-i18n="CoursePresentationn.progressTitle" class="bold my-4 p-2"></h5>
                        </div>
                        <div class="col-auto cont">
                            <h5 class="f-16 my-4 p-3"><span class="view-count">0/12</span> <span data-i18n="CoursePresentationn.lessonWord" class="lesson-word"></span></h5>
                        </div>
                    </div>
                    <div class="count d-flex flex-column position-relative">
                        <div class="in-count line top-0 start-0 z-1"></div>
                        <div class="in-count done position-absolute top-0 start-0 z-2"></div>
                    </div>
                    <p class="f-16  p-3"> %<span>0</span> <span data-i18n="CoursePresentationn.completed"></span> </p>
                </div>
            </section>

            <section class="hero sec4 mb-5">
                <div id="player" class="d-none">

                </div>
                <div class="jssec4 container-fluid">
                    <h5 data-i18n="CoursePresentationn.lessonsTitle" class="bold my-4 p-2"></h5> 
                    
                </div>
            </section>

        </div>

        <button class="back-top">
            <i class="fas fa-arrow-up"></i>
        </button>

    </main>

    <footer>
        <div class="container text-center py-3">
            <p data-i18n="footer.copy" class="f-20"></p>
        </div>
    </footer>



    <script src="https://unpkg.com/i18next@23.7.6/dist/umd/i18next.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/CoursePresentationn.js"></script>

</body>

</html>
